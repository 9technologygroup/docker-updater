listen: "127.0.0.1:7788"
log_level: info

agent_socket: /run/dup/agent.sock
agent_peer_user: dup

# Everything dup logs goes to the journal regardless: journalctl -u dup -u dup-agent
# These write a copy to a file that dup rotates and gzips itself. Set either to
# "none" to turn that file off.
log_file: /var/log/dup/dup.log          # the agent writes dup-agent.log beside it
log_max_size_mb: 10
log_keep: 5

# One JSON line per finished update, so "dup logs" survives a restart. The
# in-memory view behind "dup status" does not.
history_file: /var/lib/dup/history.jsonl
history_max_size_mb: 8
history_keep: 4

# Where "sudo dup auth <stack>" keeps registry credentials, one directory per
# stack so two stacks on the same registry can use different accounts. Each is
# 0700 root:root, so the dup service account cannot read any of them. A stack
# that has never run dup auth inherits root's own /root/.docker/config.json
# exactly as before, so leaving this alone changes nothing.
# docker_config_dir: /etc/dup/docker

# HTTPS is on by default. The installer generates the pair below before you get
# here, so copying this file is all it takes.
#
#   enabled: false      serve plain HTTP, for a reverse proxy that already
#                       terminates TLS in front of 127.0.0.1
#   self_signed: true   dup generates and may replace the pair below
#   self_signed: false  the certificate is yours, dup will never overwrite it;
#                       point cert_file and key_file at it
tls:
  enabled: true
  self_signed: true
  cert_file: /etc/dup/self-signed.crt
  key_file: /etc/dup/self-signed.key
  hosts: []

allow_from: []
trusted_proxies: []

cors:
  allowed_origins: []

auth:
  bearer_token_file: /etc/dup/bearer.token
  github_secret_file: /etc/dup/github.secret

defaults:
  check_interval: 6h
  soak: 30m
  pull_timeout: 10m
  health_timeout: 3m
  stability_window: 15s
  job_timeout: 25m
  rollback: true

# The format defaults to auto, which reads the destination off the url and
# sends what that platform documents: content for discord, text for slack and
# google chat, the full payload plus text for anything else. Set it explicitly
# only for teams, or for an endpoint behind a proxy or on a custom domain.
notify:
  url: ""
  timeout: 15s
  headers: {}

# No stacks yet, so dup starts and manages nothing. That is deliberate: run
#
#   sudo dup list
#
# to see every compose project and loose container on this host, then add the
# ones you want dup to update. After editing, run 'sudo dup check' and
# 'sudo dup audit', then 'sudo systemctl restart dup-agent dup'. The audit is
# the one that proves the dup account cannot rewrite what the root agent runs,
# and it only means something once you have real stacks here.
targets: []

# Uncomment and adapt. Only name and dir are required; everything else has a
# sensible default and can be left out entirely.
#
# targets:
#   - name: app                      # required, [a-z0-9][a-z0-9._-]*, how you refer to it
#     dir: /opt/app                  # required, absolute path holding the compose file
#
#     compose_file: docker-compose.yml   # optional, bare filename inside dir
#                                        #   default: the first compose.yaml,
#                                        #   compose.yml, docker-compose.yaml or
#                                        #   docker-compose.yml found in dir
#     env_file: .env                 # optional, bare filename inside dir
#     services: [web, worker]        # optional, default: every service in the stack
#
#     auto_update: true              # optional, default false. Poll and update on
#                                    #   a schedule. Off means dup never polls this
#                                    #   stack and never notices a new image; it
#                                    #   only acts when you or a webhook trigger it
#     check_interval: 6h             # optional, default 6h, minimum 1m. Only used
#                                    #   when auto_update is true
#     soak: 30m                      # optional, default 30m. How long a new image
#                                    #   must have been available before it is
#                                    #   applied. 0 applies immediately
#
#     rollback: true                 # optional, default true. Restore the previous
#                                    #   images if the update does not come up
#     health_timeout: 3m             # optional, default 3m. How long to wait for
#                                    #   services to settle before giving up
#     stability_window: 15s          # optional, default 15s, must be shorter than
#                                    #   health_timeout. How long they must stay
#                                    #   settled. This is what catches a container
#                                    #   that starts and then dies, and it is your
#                                    #   only real signal for services with no
#                                    #   HEALTHCHECK, since dup counts "no
#                                    #   healthcheck" as healthy
#     pull_timeout: 10m              # optional, default 10m
#     job_timeout: 25m               # optional, default 25m, the whole update
#
#     image_tag_env: APP_VERSION     # optional. Lets a caller pass --tag, which is
#                                    #   substituted into this variable. Without it
#                                    #   a tag is refused
#     allow_prerelease: false        # optional, default false. Whether a GitHub
#                                    #   prerelease webhook triggers an update
#
#     pre_update:                    # optional, runs as root before anything is
#                                    #   recreated. Back up a database here
#       command: /usr/local/bin/backup-app   # required if pre_update is set,
#                                            #   absolute path, must be executable
#       args: ["--quick"]            # optional
#       timeout: 15m                 # optional, default 10m
#       required: true               # optional, default true. false means a failing
#                                    #   hook is recorded but the update continues
